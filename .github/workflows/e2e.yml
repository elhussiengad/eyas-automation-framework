name: E2E Tests

on:
  push:
      branches: [main]
        pull_request:
            branches: [main]
              schedule:
                  - cron: '0 2 * * *'
                    workflow_dispatch:

                    jobs:
                      e2e:
                          name: Playwright (${{ matrix.project }} | shard ${{ matrix.shard }}/${{ matrix.total }})
                              runs-on: ubuntu-latest
                                  timeout-minutes: 60
                                      strategy:
                                            fail-fast: false
                                                  matrix:
                                                          project: [chromium, firefox, webkit]
                                                                  shard: [1, 2, 3, 4]
                                                                          total: [4]
                                                                              env:
                                                                                    CI: 'true'
                                                                                          BASE_URL: ${{ secrets.BASE_URL }}
                                                                                                API_URL: ${{ secrets.API_URL }}
                                                                                                      ANALYST_USER: ${{ secrets.ANALYST_USER }}
                                                                                                            ANALYST_PASS: ${{ secrets.ANALYST_PASS }}
                                                                                                                  ADMIN_USER: ${{ secrets.ADMIN_USER }}
                                                                                                                        ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
                                                                                                                            steps:
                                                                                                                                  - uses: actions/checkout@v4
                                                                                                                                        - uses: actions/setup-node@v4
                                                                                                                                                with:
                                                                                                                                                          node-version: 20
                                                                                                                                                                    cache: 'npm'
                                                                                                                                                                          - name: Install deps
                                                                                                                                                                                  run: npm ci
                                                                                                                                                                                        - name: Install Playwright browsers
                                                                                                                                                                                                run: npx playwright install --with-deps ${{ matrix.project }}
                                                                                                                                                                                                      - name: Run tests
                                                                                                                                                                                                              run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }}
                                                                                                                                                                                                                    - name: Upload HTML report
                                                                                                                                                                                                                            if: always()
                                                                                                                                                                                                                                    uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                      name: html-report-${{ matrix.project }}-${{ matrix.shard }}
                                                                                                                                                                                                                                                                path: reports/html
                                                                                                                                                                                                                                                                          retention-days: 14
                                                                                                                                                                                                                                                                                - name: Upload Allure results
                                                                                                                                                                                                                                                                                        if: always()
                                                                                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                                                  name: allure-results-${{ matrix.project }}-${{ matrix.shard }}
                                                                                                                                                                                                                                                                                                                            path: allure-results
                                                                                                                                                                                                                                                                                                                                      retention-days: 14
                                                                                                                                                                                                                                                                                                                                            - name: Upload traces
                                                                                                                                                                                                                                                                                                                                                    if: failure()
                                                                                                                                                                                                                                                                                                                                                            uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                    with:
                                                                                                                                                                                                                                                                                                                                                                              name: traces-${{ matrix.project }}-${{ matrix.shard }}
                                                                                                                                                                                                                                                                                                                                                                                        path: test-results
                                                                                                                                                                                                                                                                                                                                                                                                  retention-days: 7
                                                                                                                                                                                                                                                                                                                                                                                                  
